<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>8th grade gc</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EAF1F7;--ink:#13233A;--muted:#5A6B80;--green:#1E8E5A;--line:#C9D6E3}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
#pick{padding:24px 16px}#pick h1{font-size:26px;margin:0 0 6px}#pick p{color:var(--muted);margin:0 0 16px}
#pick button{display:block;width:100%;font:inherit;font-size:20px;font-weight:700;margin:0 0 10px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
#app{display:none;flex-direction:column;height:100%}
header{padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700}
header small{font-weight:400;color:var(--muted)}
#log{flex:1;overflow-y:auto;padding:12px 16px}
.m{margin:0 0 8px}.m .w{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 2px 4px}
.m .b{display:inline-block;background:#fff;border-radius:16px;padding:8px 12px;font-size:17px}
.m.me{text-align:right}.m.me .b{background:var(--ink);color:#fff}
.dm{background:#E6F4EC;border:1.5px solid var(--green);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:16px}
.dm b{display:block;font-size:13px;color:var(--green)}
.dm button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 12px;margin:8px 8px 0 0;background:var(--green);color:#fff}
.dm button.n{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
form{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line)}
input{flex:1;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
form button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:0 16px;background:var(--ink);color:#fff}
</style></head><body>
<div id="pick"><h1>Join the 8th grade gc</h1><p>Pick who you are. This is a demo chat for the Upstander project; please don't use real names or real messages about real people.</p><div id="names"></div></div>
<div id="app"><header>8th grade gc <small id="me"></small></header><div id="log"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Message the group" aria-label="Message"><button>Send</button></form></div>
<script>
const MEMBERS=["Maya","Jay","Tre","Kai","Ava"];let me=null;const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("names").innerHTML=MEMBERS.map(m=>`<button data-m="${m}">${m}</button>`).join("");
$("names").querySelectorAll("button").forEach(b=>b.onclick=()=>start(b.dataset.m));
const seenMsg=new Set(),seenDM=new Set();
function add(html){$("log").insertAdjacentHTML("beforeend",html);$("log").scrollTop=1e9}
function msg(m){if(seenMsg.has(m.id))return;seenMsg.add(m.id);
  add(`<div class="m ${m.sender===me?"me":""}"><p class="w">${esc(m.sender)}</p><div class="b">${esc(m.text)}</div></div>`)}
function dm(e,answered){if(e.to!==me||seenDM.has(e.id))return;seenDM.add(e.id);const id="d"+e.id;
  const ask=e.kind==="checkin"?(answered?`<div><b>You answered: ${answered==="yes"?"yes":"not now"}</b></div>`:
    `<div><button data-a="yes">Yes, tell ${esc(e.adult)}</button><button class="n" data-a="no">Not now</button></div>`):"";
  add(`<div class="dm" id="${id}"><b>Private from Upstander</b>${esc(e.text)}${ask}</div>`);
  if(navigator.vibrate)navigator.vibrate(200);
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=async()=>{b.parentElement.innerHTML="<b>Answer sent</b>";
    await fetch("/api/consent",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({target:me,answer:b.dataset.a})})})}
async function sync(){const s=await (await fetch("/api/state")).json();s.messages.forEach(msg);
  const d=await (await fetch("/api/dms?to="+encodeURIComponent(me))).json();d.dms.forEach(x=>dm(x,d.answered))}
async function start(name){me=name;$("pick").style.display="none";$("app").style.display="flex";$("me").textContent="you are "+name;await sync();connect()}
function connect(){const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen=()=>sync();
  ws.onmessage=ev=>{const e=JSON.parse(ev.data);
    if(e.type==="message")msg(e.data);
    else if(e.type==="dm")dm(e,null);
    else if(e.type==="reset")location.reload()};
  ws.onclose=()=>setTimeout(connect,1000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me)sync()});
setInterval(()=>{if(me)sync()},4000);
$("f").onsubmit=async e=>{e.preventDefault();const t=$("t").value.trim();if(!t)return;$("t").value="";
  await fetch("/api/message",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sender:me,text:t.slice(0,300)})})};
</script></body></html>
